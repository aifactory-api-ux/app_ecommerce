# API_CONTRACT.md

## 1. Get Sales Summary

| Method | Path                              | Auth Required | Query Parameters                                                                 | Request Body | Response Status | Response Schema                |
|--------|-----------------------------------|---------------|----------------------------------------------------------------------------------|--------------|----------------|-------------------------------|
| GET    | /api/dashboard/sales-summary      | No            | - start_date (string, required, ISO date)<br>- end_date (string, required, ISO date) | None         | 200 OK         | SalesSummary                  |

**Response Schema: SalesSummary**
- total_sales: int
- total_revenue: float
- period_start: string (ISO date)
- period_end: string (ISO date)

---

## 2. Get Top Products

| Method | Path                              | Auth Required | Query Parameters                                                                                                 | Request Body | Response Status | Response Schema                |
|--------|-----------------------------------|---------------|------------------------------------------------------------------------------------------------------------------|--------------|----------------|-------------------------------|
| GET    | /api/dashboard/top-products       | No            | - start_date (string, required, ISO date)<br>- end_date (string, required, ISO date)<br>- limit (integer, optional, default: 5) | None         | 200 OK         | TopProductsResponse           |

**Response Schema: TopProductsResponse**
- products: TopProduct[]

**TopProduct**
- product_id: int
- product_name: string
- units_sold: int
- revenue: float

---

## 3. Generate Sales Report

| Method | Path                              | Auth Required | Request Body (Schema: SalesReportRequest)         | Response Status | Response Schema                |
|--------|-----------------------------------|---------------|--------------------------------------------------|----------------|-------------------------------|
| POST   | /api/dashboard/sales-report       | No            | - start_date: string (ISO date, required)<br>- end_date: string (ISO date, required) | 200 OK         | SalesReportResponse           |

**Response Schema: SalesReportResponse**
- report: SalesReportEntry[]

**SalesReportEntry**
- date: string (ISO date)
- sales: int
- revenue: float