## Reports

### POST /api/v1/reports/generate

**Description:** Generate a new report

**Authentication Required:** Yes

**Request Body:**
```json
{
  "report_type": "sales_summary | product_performance | category_analysis | daily_sales",
  "start_date": "date",
  "end_date": "date",
  "format": "json | csv"
}
```

**Response (200):**
```json
{
  "report_id": "string",
  "report_type": "sales_summary | product_performance | category_analysis | daily_sales",
  "generated_at": "datetime",
  "data": "object"
}
```

---

### GET /api/v1/reports/{report_id}

**Description:** Get existing report by ID

**Authentication Required:** Yes

**Path Parameters:**
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| report_id | string | Yes | Unique identifier of the report |

**Response (200):**
```json
{
  "report_id": "string",
  "report_type": "string",
  "generated_at": "datetime",
  "data": "object"
}
```

---

### GET /api/v1/reports

**Description:** List reports

**Authentication Required:** Yes

**Query Parameters:**
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| start_date | date | No | Filter by start date |
| end_date | date | No | Filter by end date |
| report_type | string | No | Filter by report type |

**Response (200):**
```json
[
  {
    "report_id": "string",
    "report_type": "string",
    "generated_at": "datetime",
    "data": "object"
  }
]
```

---

