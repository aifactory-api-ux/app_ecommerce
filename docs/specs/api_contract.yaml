# API_CONTRACT.md

## Authentication

### POST /api/v1/auth/login

**Description:** User login, returns JWT token

**Authentication Required:** No

**Request Body:**
```json
{
  "email": "string",
  "password": "string"
}
```

**Response (200):**
```json
{
  "access_token": "string",
  "token_type": "string"
}
```

---

### POST /api/v1/auth/refresh

**Description:** Refresh access token

**Authentication Required:** No

**Request Body:**
```json
{
  "refresh_token": "string"
}
```

**Response (200):**
```json
{
  "access_token": "string",
  "token_type": "string"
}
```

---

### GET /api/v1/auth/me

**Description:** Get current user info

**Authentication Required:** Yes

**Request Body:** None

**Response (200):**
```json
{
  "id": "integer",
  "email": "string",
  "full_name": "string",
  "role": "string",
  "is_active": "boolean",
  "created_at": "datetime",
  "updated_at": "datetime"
}
```

---

## Dashboard

### GET /api/v1/dashboard/summary

**Description:** Get complete dashboard data

**Authentication Required:** Yes

**Query Parameters:**
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| start_date | date | Yes | Start date for the period |
| end_date | date | Yes | End date for the period |

**Response (200):**
```json
{
  "summary": {
    "total_sales": "decimal",
    "total_orders": "integer",
    "total_products_sold": "integer",
    "average_order_value": "decimal",
    "sales_change_percent": "float"
  },
  "sales_by_date": [
    {
      "date": "date",
      "total_sales": "decimal",
      "order_count": "integer"
    }
  ],
  "top_products": [
    {
      "product_id": "integer",
      "product_name": "string",
      "total_quantity": "integer",
      "total_revenue": "decimal",
      "category": "string",
      "sales_count": "integer"
    }
  ],
  "sales_by_category": [
    {
      "category": "string",
      "total_revenue": "decimal",
      "total_quantity": "integer",
      "percentage": "float"
    }
  ],
  "orders_by_status": [
    {
      "status": "string",
      "count": "integer"
    }
  ],
  "period_start": "date",
  "period_end": "date"
}
```

---

### GET /api/v1/dashboard/sales-by-date

**Description:** Get daily sales breakdown

**Authentication Required:** Yes

**Query Parameters:**
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| start_date | date | Yes | Start date for the period |
| end_date | date | Yes | End date for the period |

**Response (200):**
```json
[
  {
    "date": "date",
    "total_sales": "decimal",
    "order_count": "integer"
  }
]
```

---

### GET /api/v1/dashboard/top-products

**Description:** Get best selling products

**Authentication Required:** Yes

**Query Parameters:**
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| start_date | date | Yes | Start date for the period |
| end_date | date | Yes | End date for the period |
| limit | integer | No | Maximum number of products to return |

**Response (200):**
```json
[
  {
    "product_id": "integer",
    "product_name": "string",
    "total_quantity": "integer",
    "total_revenue": "decimal",
    "category": "string",
    "sales_count": "integer"
  }
]
```

