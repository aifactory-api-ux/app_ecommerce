# API_CONTRACT.md

## Endpoints

---

### 1. Get Sales Summary

| Method | Path                              | Query Parameters                                                                 | Request Body | Response Status | Response Schema   | Auth Required |
|--------|-----------------------------------|----------------------------------------------------------------------------------|--------------|-----------------|-------------------|--------------|
| GET    | /api/dashboard/sales-summary      | start_date (string, required, ISO date)<br>end_date (string, required, ISO date) | None         | 200 OK          | SalesSummary      | No           |

#### Response Schema: SalesSummary

| Field         | Type    |
|---------------|---------|
| total_sales   | int     |
| total_revenue | float   |
| period_start  | date    |
| period_end    | date    |

---

### 2. Get Top Selling Products

| Method | Path                              | Query Parameters                                                                                          | Request Body | Response Status | Response Schema       | Auth Required |
|--------|-----------------------------------|-----------------------------------------------------------------------------------------------------------|--------------|-----------------|-----------------------|--------------|
| GET    | /api/dashboard/top-products       | start_date (string, required, ISO date)<br>end_date (string, required, ISO date)<br>limit (int, optional, default: 5) | None         | 200 OK          | TopProductsResponse   | No           |

#### Response Schema: TopProductsResponse

| Field    | Type           |
|----------|----------------|
| products | List[ProductStat] |

#### ProductStat

| Field        | Type   |
|--------------|--------|
| product_id   | int    |
| product_name | str    |
| units_sold   | int    |
| revenue      | float  |

---

### 3. Generate Sales Report

| Method | Path                              | Query Parameters | Request Body           | Response Status | Response Schema       | Auth Required |
|--------|-----------------------------------|------------------|-----------------------|-----------------|-----------------------|--------------|
| POST   | /api/dashboard/sales-report       | None             | SalesReportRequest    | 200 OK          | SalesReportResponse   | No           |

#### Request Schema: SalesReportRequest

| Field      | Type   |
|------------|--------|
| start_date | date   |
| end_date   | date   |

#### Response Schema: SalesReportResponse

| Field         | Type               |
|---------------|--------------------|
| total_sales   | int                |
| total_revenue | float              |
| top_products  | List[ProductStat]  |

#### ProductStat

| Field        | Type   |
|--------------|--------|
| product_id   | int    |
| product_name | str    |
| units_sold   | int    |
| revenue      | float  |

---