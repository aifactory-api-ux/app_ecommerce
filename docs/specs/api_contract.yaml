# API_CONTRACT.md

## 1. Get Sales Summary

| Method | Path                              | Auth Required | Query Parameters                                                                 | Request Body | Response Status | Response Schema   |
|--------|-----------------------------------|---------------|----------------------------------------------------------------------------------|--------------|-----------------|------------------|
| GET    | /api/dashboard/sales-summary      | No            | start_date (string, required, ISO date)<br>end_date (string, required, ISO date) | None         | 200 OK          | SalesSummary     |

### Response Schema: SalesSummary

| Field         | Type    |
|---------------|---------|
| total_sales   | int     |
| total_revenue | float   |
| period_start  | date    |
| period_end    | date    |


---

## 2. Get Top Selling Products

| Method | Path                              | Auth Required | Query Parameters                                                                                       | Request Body | Response Status | Response Schema      |
|--------|-----------------------------------|---------------|--------------------------------------------------------------------------------------------------------|--------------|-----------------|---------------------|
| GET    | /api/dashboard/top-products       | No            | start_date (string, required, ISO date)<br>end_date (string, required, ISO date)<br>limit (int, optional, default: 5) | None         | 200 OK          | TopProductsResponse |

### Response Schema: TopProductsResponse

| Field    | Type             |
|----------|------------------|
| products | List[ProductSales] |

#### ProductSales

| Field         | Type   |
|---------------|--------|
| product_id    | int    |
| product_name  | str    |
| units_sold    | int    |
| revenue       | float  |


---

## 3. Generate Sales Report

| Method | Path                              | Auth Required | Request Body Schema      | Response Status | Response Schema        |
|--------|-----------------------------------|---------------|-------------------------|-----------------|-----------------------|
| POST   | /api/dashboard/sales-report       | No            | SalesReportRequest      | 200 OK          | SalesReportResponse   |

### Request Body Schema: SalesReportRequest

| Field      | Type   | Required |
|------------|--------|----------|
| start_date | date   | Yes      |
| end_date   | date   | Yes      |

### Response Schema: SalesReportResponse

| Field        | Type                |
|--------------|--------------------|
| summary      | SalesSummary       |
| top_products | List[ProductSales] |